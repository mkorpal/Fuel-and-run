name: Garmin Sync

on:
  # Triggered manually via GitHub API (from the app button)
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Days of data to sync'
        required: false
        default: '7'

  # Runs every 2 hours to keep today's active_kcal current
  schedule:
    - cron: '*/30 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Cache the Garmin OAuth token so each run reuses it instead of doing a
      # fresh password login (which triggers Garmin 429 rate-limits on shared IPs).
      # key includes run_id so a freshly-acquired/refreshed token is always saved.
      # restore-keys prefix finds the most recently saved token from any prior run.
      - name: Restore Garmin auth token cache
        uses: actions/cache@v4
        with:
          path: ~/.garminconnect_token
          key: garmin-token-${{ github.run_id }}
          restore-keys: garmin-token-

      - name: Run Garmin sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Scheduled runs: sync last 3 days (covers today, yesterday, and day-before-yesterday
          # in case yesterday's watch data was still uploading when the previous cron ran)
          # Manual dispatch: use the specified days_back (default 7)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DAYS=3
          else
            DAYS="${{ github.event.inputs.days_back || '7' }}"
          fi
          python scripts/sync_garmin_to_supabase.py $DAYS
